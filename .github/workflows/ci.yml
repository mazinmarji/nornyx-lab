name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Approval evaluation is intentionally independent of the runner wall clock.
  LAB_AS_OF: "2026-06-01T12:00:00Z"
  LAB_SUBJECT_REVISION: "git:5eed1e55c0ffee1abadcafe0ddba11ed15ea5e11"
  PYTHONIOENCODING: "utf-8"
  # These must exist before the first CrewAI import. Otherwise its first-run
  # tracing setup can spawn a process and invalidate guarded conformance.
  CREWAI_DISABLE_TELEMETRY: "true"
  CREWAI_TRACING_ENABLED: "false"
  CREWAI_TESTING: "true"
  OTEL_SDK_DISABLED: "true"
  UV_NO_PROGRESS: "true"

jobs:
  locks-and-contracts:
    name: Frozen locks and contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Minor pin, not a patch pin. The Windows runner image does not carry
          # every patch release, and "3.12.11" hard-failed on Windows 2025 with
          # "version not found" before a single test ran. Reproducibility here
          # comes from uv.lock and the exact nornyx/adapter pins, not from the
          # CPython patch number.
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify that pyproject and uv.lock agree
        run: uv lock --check
      - name: Sync the complete tested dependency surface
        run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Prove lock verification did not rewrite the lock
        run: git diff --exit-code -- uv.lock
      - name: Verify checked source, generated artifacts, profiles, and locks
        run: uv run --frozen python scripts/build_contracts.py --verify

  python-quality:
    name: Python lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  backend-fast:
    name: Academy and API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Unit, API, persistence, builder, evidence, and scenario tests
        run: >-
          uv run --frozen pytest tests/academy -m "not all_labs"
          -q -rs --junitxml=pytest-academy.xml
      - name: Fail if any fast gate was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-academy.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: academy-junit-${{ matrix.os }}
          path: pytest-academy.xml
          if-no-files-found: error

  legacy-regression:
    name: Full legacy regression (serial, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Verify the preserved developer environment
        run: uv run --frozen nornyx-lab doctor
      - name: Run every original lab check and repository invariant serially
        run: >-
          uv run --frozen pytest labs tests --ignore=tests/academy
          -q -rs --junitxml=pytest-legacy.xml
      - name: Fail if any legacy check was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-legacy.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legacy-junit-linux
          path: pytest-legacy.xml
          if-no-files-found: error

  structured-migration:
    name: All 25 browser migrations (${{ matrix.os }}, serial)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph
      - name: Execute every legacy lab through the structured isolation boundary
        run: >-
          uv run --frozen pytest tests/academy/test_structured.py
          -m all_labs -q -rs --junitxml=pytest-structured.xml
      - name: Fail if a migrated lab was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-structured.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: structured-junit-${{ matrix.os }}
          path: pytest-structured.xml
          if-no-files-found: error

  feedback-gateway:
    name: Feedback gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      # The gateway is a separate distribution with its own lock, because it is
      # the only component that holds GitHub write authority and must never be
      # installable as part of a learner deployment.
      - name: Verify that the gateway pyproject and lock agree
        working-directory: gateway
        run: uv lock --check
      - name: Prove lock verification did not rewrite the lock
        run: git diff --exit-code -- gateway/uv.lock
      - run: uv sync --frozen --extra dev
        working-directory: gateway
      - name: Intake, idempotency, untrusted-content, and GitHub-boundary tests
        working-directory: gateway
        # The GitHub boundary is substituted in every one of these. No job in
        # this workflow may require a real GitHub credential, and this one is
        # the job that would be tempted to.
        run: uv run --frozen pytest -q -rs --junitxml=pytest-gateway.xml
      - name: Fail if any gateway gate was skipped
        if: always()
        working-directory: gateway
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-gateway.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - name: Refuse to ship a gateway that carries a credential
        shell: bash
        run: |
          set -euo pipefail
          if grep -rInE 'ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]' gateway/ --exclude-dir=.venv; then
            echo "::error::a GitHub credential pattern is committed under gateway/"
            exit 1
          fi
          echo "no committed credential pattern under gateway/"
      - run: uv run --frozen ruff check .
        working-directory: gateway
      - run: uv run --frozen ruff format --check .
        working-directory: gateway
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gateway-junit-${{ matrix.os }}
          path: gateway/pytest-gateway.xml
          if-no-files-found: error

  feedback-gateway-container:
    name: Feedback gateway container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [feedback-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          push: false
          load: true
          tags: nornyx-feedback-gateway:0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove it serves health with no credential configured
        shell: bash
        run: |
          set -euo pipefail
          # Started with no GitHub configuration at all: the service must come
          # up and report honestly rather than refusing to boot or pretending
          # it has a destination.
          docker run -d --name gateway -p 127.0.0.1:8080:8080 \
            -e NORNYX_FEEDBACK_DB=/tmp/gateway.db \
            nornyx-feedback-gateway:0.1.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "${ready:-0}" != 1 ]; then docker logs gateway; exit 1; fi
          curl -fsS http://127.0.0.1:8080/health -o health.json
          python - <<'PY'
          import json, sys
          body = json.load(open("health.json"))
          print("gateway health:", body)
          if body["github_configured"] is not False:
              sys.exit("an unconfigured gateway reported a configured destination")
          if body["destination_visibility"] != "unknown":
              sys.exit("an unconfigured gateway claimed to know its destination")
          PY
      - name: Prove the container runs as a non-root user
        run: |
          test "$(docker exec gateway id -u)" -ne 0
          echo "gateway runs as uid $(docker exec gateway id -u)"
      - name: Prove no credential is baked into any image layer
        shell: bash
        run: |
          set -euo pipefail
          docker history --no-trunc nornyx-feedback-gateway:0.1.0 > history.txt
          if grep -qiE 'NORNYX_FEEDBACK_GITHUB_TOKEN=|ghp_[A-Za-z0-9]|github_pat_' history.txt; then
            echo "::error::a credential reached the image history"
            exit 1
          fi
          docker run --rm --entrypoint env nornyx-feedback-gateway:0.1.0 > env.txt
          if grep -q 'NORNYX_FEEDBACK_GITHUB_TOKEN' env.txt; then
            echo "::error::the image sets a GitHub token in its environment"
            exit 1
          fi
          echo "no credential in image history or default environment"
      - name: Gateway logs on failure
        if: failure()
        run: docker logs gateway || true
      - name: Tear down
        if: always()
        run: docker rm -f gateway || true

  adapter-conformance:
    name: Adapter runtime conformance (required frameworks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph
      - name: Require CrewAI and LangGraph instead of accepting absence
        run: >-
          uv run --frozen python -m nornyx_agentic_adapters.conformance
          --require crewai --require langgraph
          --json conformance-report.json --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-conformance-report
          path: conformance-report.json
          if-no-files-found: error

  frontend-quality:
    name: Frontend component tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        # Strict: the lockfile is committed, so transitive versions are
        # frozen and `npm ci` fails if package.json and the lock disagree.
        run: npm ci --ignore-scripts
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  learner-journey:
    name: Fresh learner browser and accessibility journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-fast, frontend-quality]
    env:
      # NOTE: `${{ runner.temp }}` must NOT be used here. The `runner` context
      # exists only inside steps; in a job-level `env:` block GitHub rejects the
      # ENTIRE workflow file before scheduling anything ("Unrecognized
      # named-value: 'runner'"). That is what produced a 0-second failure with
      # zero jobs and no logs. `$RUNNER_TEMP` is an ordinary environment
      # variable available everywhere, so a step exports the path instead.
      #
      # Playwright starts the backend from frontend/. Freeze that indirect uv
      # invocation as well as the explicit setup command below.
      UV_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Point the academy database at the runner temp directory
        shell: bash
        run: echo "NORNYX_ACADEMY_DB=$RUNNER_TEMP/academy-e2e.db" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - name: Install frontend dependencies
        working-directory: frontend
        # Strict: the lockfile is committed, so transitive versions are
        # frozen and `npm ci` fails if package.json and the lock disagree.
        run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Run the real API, browser UI, screenshot, and axe checks
        run: npm run test:e2e
        working-directory: frontend
      # Debugging evidence: traces and failure screenshots. Deliberately named
      # and uploaded separately from the reviewer-facing journey below, because
      # the two answer different questions and confusing them would put failure
      # screenshots in front of a reviewer as if they were the product.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-debug-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------- B4
      # Reviewer-visible learner journey. Answers "can a reviewer see what the
      # learner sees without checking out and building the branch?" and nothing
      # more: these are presentation captures, not a correctness claim.
      # On a pull_request event GITHUB_SHA is the ephemeral merge commit GitHub
      # creates, not the commit under review. Naming the artifact after it sends
      # a reviewer looking for a SHA that exists nowhere in the branch, and a
      # manifest carrying it misattributes what they are looking at. Use the PR
      # head, falling back to github.sha on push.
      - name: Resolve the commit under review
        shell: bash
        run: echo "JOURNEY_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Capture the reviewer-visible learner journey
        run: npm run test:journey
        working-directory: frontend

      - name: Verify the set is complete before anything is published
        # An incomplete set is never uploaded. A missing screen in a published
        # artifact looks like a screen that does not exist, which is worse than
        # having no artifact at all.
        run: >
          uv run --frozen python scripts/verify_journey_artifacts.py
          frontend/journey-artifacts --expect-commit "$JOURNEY_COMMIT"

      - name: Name the artifact after the commit under review
        id: journey
        shell: bash
        run: echo "name=learner-journey-${JOURNEY_COMMIT::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.journey.outputs.name }}
          path: frontend/journey-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Link the journey in the job summary
        shell: bash
        run: |
          {
            echo "### Reviewer-visible learner journey"
            echo
            echo "Artifact: **${{ steps.journey.outputs.name }}** — in the *Artifacts* section of [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "The nine guided screens at 375x812, plus the governed payoff at 1280x800."
            echo "Each screen was captured after the real gate it depends on was satisfied —"
            echo "screen 6 follows an actual governed execution, not direct navigation."
            echo
            echo "> These show presentation at a captured state. They are **not** evidence that"
            echo "> the journey behaved correctly; the executable specs remain that evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  container-build:
    name: Production container build and learner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [locks-and-contracts, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          # `load: true` puts the image in the local daemon. Without it the
          # image only exists in the build cache and CANNOT be started, which
          # is why this job used to prove nothing beyond "the Dockerfile parses".
          load: true
          tags: nornyx-academy:2.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The defect the first independent B5 run exposed: the semantic checker was
      # a Python program embedded in a shell string, so bash rewrote its quoting
      # and no test ever executed the payload the way production does. Every
      # guard passed while the checker was broken.
      #
      # This runs the real module, in the real image, through the exact
      # invocation `verify_independent_deployment.sh` uses. It is the gate that
      # would have caught it.
      - name: Execute the B5 semantic checker inside the production image
        run: |
          set -uo pipefail

          docker run --rm -i --entrypoint python nornyx-academy:2.0.0             -m nornyx_lab.verification.check_counters             < tests/fixtures/demo-run.valid.json
          echo "valid fixture accepted (exit 0)"

          # A governed 0/0 marked `not_planned` is the overclaim the curriculum
          # exists to prevent. It must be rejected, and rejected as a *product*
          # failure (1), not as an instrument failure (4).
          status=0
          docker run --rm -i --entrypoint python nornyx-academy:2.0.0             -m nornyx_lab.verification.check_counters             < tests/fixtures/demo-run.wrong-meaning.json || status=$?
          if [ "$status" -ne 1 ]; then
            echo "expected product-failure exit 1 for the bad fixture, got ${status}" >&2
            exit 1
          fi
          echo "wrong-meaning fixture rejected with the product-failure code (exit 1)"

      # A built image is not a serving application. The README tells a learner to
      # run `docker compose up`, so that documented path — including read_only,
      # cap_drop ALL, no-new-privileges, and the named progress volume — is what
      # gets exercised here.
      - name: Start the learner stack the way the README documents
        run: docker compose up -d --no-build

      - name: Prove the container serves a usable learner application
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "${ready:-0}" != 1 ]; then echo "::error::container never became healthy"; exit 1; fi

          # The browser application must be served from the same origin.
          curl -fsS http://127.0.0.1:8000/ -o index.html
          grep -qi '<div id="root"' index.html || { echo "::error::the SPA shell was not served"; exit 1; }

          # The learner page must be unable to reach any external host. This is
          # what makes "the browser never talks to a feedback gateway or to
          # GitHub" structural rather than a matter of discipline, and it can
          # only be checked here: under `npm run preview` the document comes
          # from Vite, so the served document is the production path.
          curl -fsSI http://127.0.0.1:8000/ | tr -d '\r' > headers.txt
          grep -qi "connect-src 'self'" headers.txt || {
            echo "::error::the served SPA document carries no connect-src 'self' policy"; exit 1; }
          echo "served SPA document restricts connections to same-origin"

          # A default learner deployment must have no feedback destination and
          # no credential to reach one with.
          curl -fsS http://127.0.0.1:8000/api/v1/feedback -o feedback.json
          python - <<'PY'
          import json, sys
          status = json.load(open("feedback.json"))
          print("feedback status in container:", status["sync"]["status"])
          if status["sending_configured"] is not False:
              sys.exit("the default container is configured to send feedback")
          if status["consent_state"] != "not_asked":
              sys.exit("the default container starts with consent already recorded")
          if status["module_feedback"] or status["course_feedback"]:
              sys.exit("the default container fabricated feedback records")
          print("feedback is local-only, unconsented, and empty by default")
          PY

          # And the image itself must hold no GitHub authority of any kind.
          if docker compose exec -T academy env | grep -q 'NORNYX_FEEDBACK_GITHUB'; then
            echo "::error::the learner container exposes a feedback GitHub variable"; exit 1
          fi
          if docker compose exec -T academy sh -c 'ls /app' | grep -qx 'gateway'; then
            echo "::error::the learner image contains the feedback gateway"; exit 1
          fi
          echo "learner container holds no GitHub credential and no gateway"

          # The real governance engine must work INSIDE the container, not just
          # in the test harness: ungoverned publishes 1/1, governed 0/0.
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/demo/run -H 'content-type: application/json' -d '{}' -o demo.json
          python - <<'PY'
          import json, sys
          run = json.load(open("demo.json"))
          got = {}
          for variant in run["variants"]:
              counter = next(c for c in variant["counters"] if c["action"] == "publish_external")
              got[variant["id"]] = (counter["attempts"], counter["completions"])
          print("publish counters in container:", got)
          expected = {"ungoverned": (1, 1), "governed": (0, 0)}
          if got != expected:
              sys.exit(f"expected {expected}, got {got}")
          governed = next(v for v in run["variants"] if v["id"] == "governed")
          if governed["evidence"]["validation_status"] != "pass":
              sys.exit("governed evidence did not validate inside the container")
          print("container smoke: A/B semantics and bound evidence confirmed")
          PY

          # Progress must persist to the mounted volume, not a container-local path.
          curl -fsS http://127.0.0.1:8000/api/v1/progress -o progress.json
          python -c "import json;d=json.load(open('progress.json'));assert d.get('modules'),'no progress record';print('progress store reachable')"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
