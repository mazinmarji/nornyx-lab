name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Approval evaluation is intentionally independent of the runner wall clock.
  LAB_AS_OF: "2026-06-01T12:00:00Z"
  LAB_SUBJECT_REVISION: "git:5eed1e55c0ffee1abadcafe0ddba11ed15ea5e11"
  PYTHONIOENCODING: "utf-8"
  # These must exist before the first CrewAI import. Otherwise its first-run
  # tracing setup can spawn a process and invalidate guarded conformance.
  CREWAI_DISABLE_TELEMETRY: "true"
  CREWAI_TRACING_ENABLED: "false"
  CREWAI_TESTING: "true"
  OTEL_SDK_DISABLED: "true"
  UV_NO_PROGRESS: "true"

jobs:
  locks-and-contracts:
    name: Frozen locks and contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Minor pin, not a patch pin. The Windows runner image does not carry
          # every patch release, and "3.12.11" hard-failed on Windows 2025 with
          # "version not found" before a single test ran. Reproducibility here
          # comes from uv.lock and the exact nornyx/adapter pins, not from the
          # CPython patch number.
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify that pyproject and uv.lock agree
        run: uv lock --check
      - name: Sync the complete tested dependency surface
        run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Prove lock verification did not rewrite the lock
        run: git diff --exit-code -- uv.lock
      - name: Verify checked source, generated artifacts, profiles, and locks
        run: uv run --frozen python scripts/build_contracts.py --verify

  python-quality:
    name: Python lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  backend-fast:
    name: Academy and API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Unit, API, persistence, builder, evidence, and scenario tests
        run: >-
          uv run --frozen pytest tests/academy -m "not all_labs"
          -q -rs --junitxml=pytest-academy.xml
      - name: Fail if any fast gate was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-academy.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: academy-junit-${{ matrix.os }}
          path: pytest-academy.xml
          if-no-files-found: error

  legacy-regression:
    name: Full legacy regression (serial, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph --extra live
      - name: Verify the preserved developer environment
        run: uv run --frozen nornyx-lab doctor
      - name: Run every original lab check and repository invariant serially
        run: >-
          uv run --frozen pytest labs tests/test_repository.py
          -q -rs --junitxml=pytest-legacy.xml
      - name: Fail if any legacy check was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-legacy.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legacy-junit-linux
          path: pytest-legacy.xml
          if-no-files-found: error

  structured-migration:
    name: All 25 browser migrations (${{ matrix.os }}, serial)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph
      - name: Execute every legacy lab through the structured isolation boundary
        run: >-
          uv run --frozen pytest tests/academy/test_structured.py
          -m all_labs -q -rs --junitxml=pytest-structured.xml
      - name: Fail if a migrated lab was skipped
        if: always()
        run: >-
          uv run --frozen python -c "import pathlib, xml.etree.ElementTree as ET;
          p=pathlib.Path('pytest-structured.xml');
          root=ET.parse(p).getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in root.iter('testsuite'));
          print(f'pytest skipped: {skipped}');
          raise SystemExit(skipped > 0)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: structured-junit-${{ matrix.os }}
          path: pytest-structured.xml
          if-no-files-found: error

  adapter-conformance:
    name: Adapter runtime conformance (required frameworks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra crewai --extra langgraph
      - name: Require CrewAI and LangGraph instead of accepting absence
        run: >-
          uv run --frozen python -m nornyx_agentic_adapters.conformance
          --require crewai --require langgraph
          --json conformance-report.json --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-conformance-report
          path: conformance-report.json
          if-no-files-found: error

  frontend-quality:
    name: Frontend component tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        # Strict: the lockfile is committed, so transitive versions are
        # frozen and `npm ci` fails if package.json and the lock disagree.
        run: npm ci --ignore-scripts
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  learner-journey:
    name: Fresh learner browser and accessibility journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-fast, frontend-quality]
    env:
      # NOTE: `${{ runner.temp }}` must NOT be used here. The `runner` context
      # exists only inside steps; in a job-level `env:` block GitHub rejects the
      # ENTIRE workflow file before scheduling anything ("Unrecognized
      # named-value: 'runner'"). That is what produced a 0-second failure with
      # zero jobs and no logs. `$RUNNER_TEMP` is an ordinary environment
      # variable available everywhere, so a step exports the path instead.
      #
      # Playwright starts the backend from frontend/. Freeze that indirect uv
      # invocation as well as the explicit setup command below.
      UV_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Point the academy database at the runner temp directory
        shell: bash
        run: echo "NORNYX_ACADEMY_DB=$RUNNER_TEMP/academy-e2e.db" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - name: Install frontend dependencies
        working-directory: frontend
        # Strict: the lockfile is committed, so transitive versions are
        # frozen and `npm ci` fails if package.json and the lock disagree.
        run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Run the real API, browser UI, screenshot, and axe checks
        run: npm run test:e2e
        working-directory: frontend
      # Debugging evidence: traces and failure screenshots. Deliberately named
      # and uploaded separately from the reviewer-facing journey below, because
      # the two answer different questions and confusing them would put failure
      # screenshots in front of a reviewer as if they were the product.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-debug-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------- B4
      # Reviewer-visible learner journey. Answers "can a reviewer see what the
      # learner sees without checking out and building the branch?" and nothing
      # more: these are presentation captures, not a correctness claim.
      # On a pull_request event GITHUB_SHA is the ephemeral merge commit GitHub
      # creates, not the commit under review. Naming the artifact after it sends
      # a reviewer looking for a SHA that exists nowhere in the branch, and a
      # manifest carrying it misattributes what they are looking at. Use the PR
      # head, falling back to github.sha on push.
      - name: Resolve the commit under review
        shell: bash
        run: echo "JOURNEY_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Capture the reviewer-visible learner journey
        run: npm run test:journey
        working-directory: frontend

      - name: Verify the set is complete before anything is published
        # An incomplete set is never uploaded. A missing screen in a published
        # artifact looks like a screen that does not exist, which is worse than
        # having no artifact at all.
        run: >
          uv run --frozen python scripts/verify_journey_artifacts.py
          frontend/journey-artifacts --expect-commit "$JOURNEY_COMMIT"

      - name: Name the artifact after the commit under review
        id: journey
        shell: bash
        run: echo "name=learner-journey-${JOURNEY_COMMIT::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.journey.outputs.name }}
          path: frontend/journey-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Link the journey in the job summary
        shell: bash
        run: |
          {
            echo "### Reviewer-visible learner journey"
            echo
            echo "Artifact: **${{ steps.journey.outputs.name }}** — in the *Artifacts* section of [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "The nine guided screens at 375x812, plus the governed payoff at 1280x800."
            echo "Each screen was captured after the real gate it depends on was satisfied —"
            echo "screen 6 follows an actual governed execution, not direct navigation."
            echo
            echo "> These show presentation at a captured state. They are **not** evidence that"
            echo "> the journey behaved correctly; the executable specs remain that evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  container-build:
    name: Production container build and learner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [locks-and-contracts, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          # `load: true` puts the image in the local daemon. Without it the
          # image only exists in the build cache and CANNOT be started, which
          # is why this job used to prove nothing beyond "the Dockerfile parses".
          load: true
          tags: nornyx-academy:2.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image is not a serving application. The README tells a learner to
      # run `docker compose up`, so that documented path — including read_only,
      # cap_drop ALL, no-new-privileges, and the named progress volume — is what
      # gets exercised here.
      - name: Start the learner stack the way the README documents
        run: docker compose up -d --no-build

      - name: Prove the container serves a usable learner application
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "${ready:-0}" != 1 ]; then echo "::error::container never became healthy"; exit 1; fi

          # The browser application must be served from the same origin.
          curl -fsS http://127.0.0.1:8000/ -o index.html
          grep -qi '<div id="root"' index.html || { echo "::error::the SPA shell was not served"; exit 1; }

          # The real governance engine must work INSIDE the container, not just
          # in the test harness: ungoverned publishes 1/1, governed 0/0.
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/demo/run -H 'content-type: application/json' -d '{}' -o demo.json
          python - <<'PY'
          import json, sys
          run = json.load(open("demo.json"))
          got = {}
          for variant in run["variants"]:
              counter = next(c for c in variant["counters"] if c["action"] == "publish_external")
              got[variant["id"]] = (counter["attempts"], counter["completions"])
          print("publish counters in container:", got)
          expected = {"ungoverned": (1, 1), "governed": (0, 0)}
          if got != expected:
              sys.exit(f"expected {expected}, got {got}")
          governed = next(v for v in run["variants"] if v["id"] == "governed")
          if governed["evidence"]["validation_status"] != "pass":
              sys.exit("governed evidence did not validate inside the container")
          print("container smoke: A/B semantics and bound evidence confirmed")
          PY

          # Progress must persist to the mounted volume, not a container-local path.
          curl -fsS http://127.0.0.1:8000/api/v1/progress -o progress.json
          python -c "import json;d=json.load(open('progress.json'));assert d.get('modules'),'no progress record';print('progress store reachable')"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
