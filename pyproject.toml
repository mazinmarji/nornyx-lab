[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nornyx-lab"
version = "2.0.0"
description = "A browser-based interactive academy for AI engineering, agentic systems, governance, and Nornyx."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mazin Marji" }]
keywords = ["ai-governance", "agentic", "nornyx", "training", "lab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Security",
]

# Pinned on purpose. Every lab transcript in this repo was produced against
# exactly these versions; a floating range would let a future release change a
# diagnostic code and silently invalidate the lessons.
dependencies = [
  "nornyx==1.11.0",
  "nornyx-agentic-adapters==0.3.0",
  "fastapi==0.141.1",
  # Latest stable release within CrewAI 1.15.4's supported >=2.11.9,<2.13 range.
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "rich==14.3.4",
  "typer==0.27.1",
  "uvicorn[standard]==0.52.1",
  # CrewAI 1.15.4 (the adapter-supported version) requires tomli <2.1 on
  # Python 3.10. Newer Python versions use stdlib tomllib and need no backport.
  "tomli==2.0.2; python_version < '3.11'",
]

[project.optional-dependencies]
# Framework adapters are optional: labs 18-20 skip loudly rather than fail when
# the framework is absent, so the core path stays installable everywhere.
crewai = ["nornyx-agentic-adapters[crewai]==0.3.0"]
langgraph = ["nornyx-agentic-adapters[langgraph]==0.3.0"]
# Legacy author/developer surface only. Not part of the learner journey.
notebooks = ["jupyterlab==4.6.2", "notebook==7.6.1"]
live = ["anthropic==0.117.0"]
dev = [
  # Starlette 1.4's TestClient prefers the maintained HTTPX2 continuation.
  "httpx2==2.7.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/mazinmarji/nornyx-lab"
Nornyx = "https://github.com/mazinmarji/nornyx"

[project.scripts]
nornyx-lab = "nornyx_lab.cli:app"
nornyx-academy = "nornyx_lab.academy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nornyx_lab.academy.content" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
python_files = ["checks.py", "test_*.py"]
# importlib mode is required: every lab ships a file called checks.py, and the
# default prepend mode collides on the shared basename.
addopts = "-q --import-mode=importlib"
markers = [
  "all_labs: slow serial migration gate that executes every legacy lab through the structured academy boundary",
]

[tool.ruff]
line-length = 100
src = ["src", "labs"]
# Notebooks are generated by scripts/build_notebooks.py. Linting a derived
# artifact is a category error — fix the generator instead.
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length: prose tables in the labs are wider than code
  "B008",  # typer.Argument/Option in defaults is this library's documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Labs deliberately import inside `run()` so each lab reads top-to-bottom as a
# lesson, with the import next to the concept it introduces.
"labs/*/lab.py" = ["E402"]
