[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nornyx-lab"
version = "1.0.0"
description = "A hands-on lab for AI governance with Nornyx: 25 runnable labs from first principles to a governed capstone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mazin Marji" }]
keywords = ["ai-governance", "agentic", "nornyx", "training", "lab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Security",
]

# Pinned on purpose. Every lab transcript in this repo was produced against
# exactly these versions; a floating range would let a future release change a
# diagnostic code and silently invalidate the lessons.
dependencies = [
  "nornyx==1.11.0",
  "nornyx-agentic-adapters==0.3.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# Framework adapters are optional: labs 18-20 skip loudly rather than fail when
# the framework is absent, so the core path stays installable everywhere.
crewai = ["nornyx-agentic-adapters[crewai]==0.3.0"]
langgraph = ["nornyx-agentic-adapters[langgraph]==0.3.0"]
notebooks = ["jupyterlab>=4.2", "notebook>=7.2"]
live = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/mazinmarji/nornyx-lab"
Nornyx = "https://github.com/mazinmarji/nornyx"

[project.scripts]
nornyx-lab = "nornyx_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
python_files = ["checks.py", "test_*.py"]
# importlib mode is required: every lab ships a file called checks.py, and the
# default prepend mode collides on the shared basename.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "labs"]
# Notebooks are generated by scripts/build_notebooks.py. Linting a derived
# artifact is a category error — fix the generator instead.
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length: prose tables in the labs are wider than code
  "B008",  # typer.Argument/Option in defaults is this library's documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Labs deliberately import inside `run()` so each lab reads top-to-bottom as a
# lesson, with the import next to the concept it introduces.
"labs/*/lab.py" = ["E402"]
